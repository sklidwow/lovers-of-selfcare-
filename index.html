<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Los Brows — Дашборд</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #d4847d;
            --accent-dark: #c9746f;
            --ink: #3a2a2a;
            --ink-muted: #8a7373;
            --surface: #ffffff;
            --bg: #fef5f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fef5f0 0%, #faf3f0 50%, #f5f0f8 100%);
            color: var(--ink);
            min-height: 100vh;
            padding: 20px 16px 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-dark);
        }

        .header p {
            font-size: 13px;
            color: var(--ink-muted);
            margin-top: 4px;
        }

        .state {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .state.error {
            color: #b34a4a;
        }

        [hidden] {
            display: none !important;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--surface);
            border-radius: 18px;
            padding: 14px 10px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(212, 132, 125, 0.12);
        }

        .kpi-label {
            font-size: 11px;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .kpi-revenue {
            font-size: 17px;
            font-weight: 700;
            color: var(--ink);
        }

        .kpi-bookings {
            font-size: 12px;
            color: var(--accent-dark);
            margin-top: 4px;
            font-weight: 600;
        }

        .section {
            background: var(--surface);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(212, 132, 125, 0.1);
            margin-bottom: 16px;
        }

        .section h2 {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 14px;
        }

        .staff-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(212, 132, 125, 0.1);
        }

        .staff-row:last-child {
            border-bottom: none;
        }

        .staff-name {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .staff-rank {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg);
            color: var(--accent-dark);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .staff-figures {
            text-align: right;
        }

        .staff-revenue {
            font-size: 13px;
            font-weight: 700;
        }

        .staff-bookings {
            font-size: 11px;
            color: var(--ink-muted);
        }

        .empty {
            font-size: 13px;
            color: var(--ink-muted);
            text-align: center;
            padding: 12px 0;
        }

        .refresh {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .refresh:disabled {
            opacity: 0.6;
        }

        .updated-at {
            text-align: center;
            font-size: 11px;
            color: var(--ink-muted);
            margin-top: 12px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1c1416;
                color: #f0e6e6;
            }
            :root {
                --surface: #2a1f21;
                --ink: #f0e6e6;
                --ink-muted: #b09a9a;
                --bg: #3a2a2c;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="companyTitle">Los Brows</h1>
        <p id="companySubtitle">Дашборд</p>
    </div>

    <div class="state" id="loadingState">Загружаю данные…</div>
    <div class="state error" hidden id="errorState"></div>

    <div id="dashboard" hidden>
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Сегодня</div>
                <div class="kpi-revenue" id="todayRevenue">—</div>
                <div class="kpi-bookings" id="todayBookings">—</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Неделя</div>
                <div class="kpi-revenue" id="weekRevenue">—</div>
                <div class="kpi-bookings" id="weekBookings">—</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Месяц</div>
                <div class="kpi-revenue" id="monthRevenue">—</div>
                <div class="kpi-bookings" id="monthBookings">—</div>
            </div>
        </div>

        <div class="section">
            <h2>Топ мастеров за месяц</h2>
            <div id="staffList"></div>
        </div>

        <button class="refresh" id="refreshBtn">Обновить</button>
        <div class="updated-at" id="updatedAt"></div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;

        const money = new Intl.NumberFormat('ru-RU', {
            style: 'currency',
            currency: 'RUB',
            maximumFractionDigits: 0,
        });

        function bookingsLabel(count) {
            const mod10 = count % 10;
            const mod100 = count % 100;
            let word = 'записей';
            if (mod100 < 11 || mod100 > 14) {
                if (mod10 === 1) word = 'запись';
                else if (mod10 >= 2 && mod10 <= 4) word = 'записи';
            }
            return `${count} ${word}`;
        }

        function renderStaff(list) {
            const el = document.getElementById('staffList');
            if (!list || list.length === 0) {
                el.innerHTML = '<div class="empty">Пока нет записей за месяц</div>';
                return;
            }
            el.innerHTML = list
                .map(
                    (s, i) => `
                <div class="staff-row">
                    <div class="staff-name"><span class="staff-rank">${i + 1}</span>${s.name}</div>
                    <div class="staff-figures">
                        <div class="staff-revenue">${money.format(s.revenue)}</div>
                        <div class="staff-bookings">${bookingsLabel(s.bookings)}</div>
                    </div>
                </div>`
                )
                .join('');
        }

        function render(data) {
            if (data.company?.title) {
                document.getElementById('companyTitle').textContent = data.company.title;
            }
            if (data.company?.city) {
                document.getElementById('companySubtitle').textContent = `Дашборд · ${data.company.city}`;
            }

            document.getElementById('todayRevenue').textContent = money.format(data.today.revenue);
            document.getElementById('todayBookings').textContent = bookingsLabel(data.today.bookings);
            document.getElementById('weekRevenue').textContent = money.format(data.week.revenue);
            document.getElementById('weekBookings').textContent = bookingsLabel(data.week.bookings);
            document.getElementById('monthRevenue').textContent = money.format(data.month.revenue);
            document.getElementById('monthBookings').textContent = bookingsLabel(data.month.bookings);

            renderStaff(data.topStaff);

            const updated = new Date(data.generatedAt);
            document.getElementById('updatedAt').textContent = `Обновлено в ${updated.toLocaleTimeString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit',
            })}`;

            document.getElementById('loadingState').hidden = true;
            document.getElementById('errorState').hidden = true;
            document.getElementById('dashboard').hidden = false;
        }

        function showError(message) {
            document.getElementById('loadingState').hidden = true;
            document.getElementById('dashboard').hidden = true;
            const el = document.getElementById('errorState');
            el.textContent = message;
            el.hidden = false;
        }

        async function loadDashboard() {
            if (!tg || !tg.initData) {
                showError('Откройте дашборд через Telegram-бота — вне Telegram доступ к данным закрыт.');
                return;
            }

            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) refreshBtn.disabled = true;

            try {
                const response = await fetch('/api/dashboard/overview', {
                    headers: { 'X-Telegram-Init-Data': tg.initData },
                });
                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || `Ошибка сервера (${response.status})`);
                }
                render(data);
            } catch (err) {
                showError(err.message || 'Не удалось загрузить данные');
            } finally {
                if (refreshBtn) refreshBtn.disabled = false;
            }
        }

        if (tg) {
            tg.ready();
            tg.expand();
        }

        document.getElementById('refreshBtn')?.addEventListener('click', loadDashboard);
        loadDashboard();
    </script>
</body>
</html>
